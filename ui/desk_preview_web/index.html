<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品イメージ</title>
<style>
  :root {
    --bg: #1d1f22;
    --panel: rgba(28, 30, 34, 0.9);
    --line: rgba(255, 255, 255, 0.1);
    --text: #e9eaec;
    --muted: #9aa0a8;
    --accent: #ffd25a;
    --btn: rgba(255, 255, 255, 0.07);
    --btn-hover: rgba(255, 255, 255, 0.13);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; user-select: none; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; outline: none; }

  #panel { position: absolute; top: 12px; right: 12px; width: 268px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px;
    backdrop-filter: blur(6px); transition: transform .2s ease, opacity .2s ease; }
  body.panel-hidden #panel { transform: translateX(calc(100% + 16px)); opacity: 0; pointer-events: none; }
  #toggle-panel { position: absolute; top: 12px; left: 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }

  .size { border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 4px; }
  .size .label { color: var(--muted); font-size: 11px; }
  #size-main { font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing: .01em; }
  #size-sub { color: var(--muted); font-size: 11.5px; }
  h2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; letter-spacing: .04em; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { flex: 1 1 auto; min-width: 54px; background: var(--btn); color: var(--text); border: 1px solid transparent;
    border-radius: 6px; padding: 5px 6px; cursor: pointer; font: inherit; }
  .seg button:hover { background: var(--btn-hover); }
  .seg button.active { border-color: var(--accent); color: var(--accent); background: rgba(255, 210, 90, 0.1); }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  select { width: 100%; background: #2a2d32; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  label.check { display: flex; align-items: center; gap: 6px; margin-top: 4px; cursor: pointer; }
  #shot { width: 100%; margin-top: 12px; background: var(--accent); color: #1d1f22; border: 0; border-radius: 7px;
    padding: 7px; font: inherit; font-weight: 600; cursor: pointer; }
  #shot:hover { filter: brightness(1.08); }
  .note { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #props-note:empty, #color-src:empty { display: none; }

  #fps { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 11px; opacity: .7; }
  #hint { position: absolute; left: 12px; bottom: 26px; color: var(--muted); font-size: 11px; opacity: .7; }
  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    background: var(--bg); color: var(--muted); font-size: 14px; text-align: center; }
  #loading.show { display: flex; }
  #toast { position: absolute; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; transition: all .25s;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; max-width: 80%; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.min.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<button id="toggle-panel" title="設定パネルの表示切替">☰ 設定</button>

<div id="panel">
  <div class="size">
    <div class="label">作品の実寸</div>
    <div id="size-main">—</div>
    <div id="size-sub"></div>
  </div>

  <h2>置き方</h2>
  <div class="seg" id="opt-placement"></div>

  <h2>アイロン</h2>
  <div class="seg" id="opt-ironing"></div>

  <h2>照明</h2>
  <div class="seg" id="opt-lighting"></div>
  <div class="row" style="margin-top:6px">
    <span class="note" style="margin:0">露出</span>
    <input id="exposure" type="range" min="0.3" max="2" step="0.05" value="1">
    <span id="exposure-val" class="note" style="margin:0;width:30px;text-align:right">1.00</span>
  </div>

  <h2>視点</h2>
  <div class="seg" id="opt-view"></div>

  <h2>ビーズの大きさ</h2>
  <select id="pitch">
    <option value="app">本体の設定</option>
    <option value="2.6">ミニビーズ（2.6 mm）</option>
    <option value="5">レギュラービーズ（5 mm）</option>
  </select>

  <h2>表示</h2>
  <label class="check"><input id="dims" type="checkbox" checked> 寸法線</label>
  <label class="check"><input id="props" type="checkbox" checked> 比較用の小物</label>
  <label class="check" title="物の接地面やすき間の陰影を描きます。重いと感じたら外してください"><input id="ao" type="checkbox" checked> 接地の陰影（AO）</label>
  <div id="props-note" class="note"></div>

  <button id="shot">この視点を PNG で保存</button>
  <div id="color-src" class="note"></div>
  <div class="note">表示色はモニターの色再現に左右されます。実物との比較用の目安としてご覧ください。</div>
</div>

<div id="hint">左ドラッグ: 回転 ／ 右ドラッグ: 移動 ／ ホイール: ズーム</div>
<div id="fps"></div>
<div id="loading" class="show">読み込み中…</div>
<div id="toast"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
